<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>读取进度</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #161618;
        color: #f2f1ee;
        font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }
      .box {
        box-sizing: border-box;
        height: 100%;
        padding: 14px 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #msg {
        flex: 1;
        font-size: 13px;
        line-height: 1.4;
        min-width: 0;
      }
      #count {
        flex-shrink: 0;
        font-size: 12px;
        color: #8e8d89;
        font-variant-numeric: tabular-nums;
      }
      button {
        flex-shrink: 0;
        height: 30px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        background: #2a2a2c;
        color: #f2f1ee;
        font-size: 12px;
        cursor: pointer;
      }
      .bar {
        height: 6px;
        border-radius: 99px;
        background: #0c0c0d;
        overflow: hidden;
      }
      #fill {
        height: 100%;
        width: 0;
        background: #f2f1ee;
        border-radius: 99px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="row">
        <div id="msg">准备读取…</div>
        <div id="count"></div>
        <button type="button" id="stop">停止</button>
      </div>
      <div class="bar"><div id="fill"></div></div>
    </div>
    <script>
      const msg = document.getElementById("msg");
      const count = document.getElementById("count");
      const fill = document.getElementById("fill");
      document.getElementById("stop").onclick = () => window.cangxiaProgress.stop();
      window.cangxiaProgress.onUpdate((job) => {
        msg.textContent = job.message || "正在读取";
        if (job.total > 0 && job.total < 10000) {
          count.textContent = job.current + "/" + job.total;
          fill.style.width = Math.min(100, Math.round((job.current / job.total) * 100)) + "%";
        } else {
          count.textContent = job.current > 0 ? String(job.current) : "";
          fill.style.width = job.active ? "12%" : "0";
        }
      });
    </script>
  </body>
</html>
