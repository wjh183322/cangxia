<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>扫码登录</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0c0d;
        color: #f2f1ee;
        font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      }
      .wrap {
        box-sizing: border-box;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 36px 28px 28px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }
      .hint {
        margin: 10px 0 24px;
        font-size: 13px;
        color: #8e8d89;
        text-align: center;
        line-height: 1.6;
      }
      #box {
        width: 260px;
        height: 260px;
        border-radius: 16px;
        background: #161618;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8e8d89;
        font-size: 13px;
      }
      #box img {
        width: 236px;
        height: 236px;
        background: #fff;
        padding: 10px;
        border-radius: 12px;
        box-sizing: border-box;
      }
      #status {
        margin-top: 20px;
        font-size: 12px;
        color: #6a6966;
        min-height: 1.4em;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>扫码登录</h1>
      <p class="hint">打开抖音 App，点左上角扫一扫<br />只登录自己的号</p>
      <div id="box">正在获取二维码…</div>
      <p id="status"></p>
    </div>
    <script>
      const box = document.getElementById("box");
      const status = document.getElementById("status");
      window.cangxiaQr.onCode((data) => {
        if (!data || !(data.startsWith("data:image") || data.startsWith("https://") || data.startsWith("http://"))) return;
        box.innerHTML = "";
        const img = document.createElement("img");
        img.alt = "登录二维码";
        img.src = data;
        box.appendChild(img);
        status.textContent = "二维码约两分钟有效，过期会自动换新";
      });
      window.cangxiaQr.onStatus((text) => {
        status.textContent = text || "";
      });
    </script>
  </body>
</html>
